name: Preview Build

on:
  workflow_dispatch:

jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Golang Status
        shell: bash
        run: |
          find buildScript libcore -name "*.sh" -type f -print0 \
            | sort -z \
            | xargs -0 cat \
            | sha1sum > golang_status

      - name: Libcore Status
        shell: bash
        run: |
          git ls-files libcore \
            | sort \
            | xargs -r cat \
            | sha1sum > libcore_status

      - name: LibCore Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: app/libs/libcore.aar
          key: libcore-${{ runner.os }}-${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}

      - name: Setup Go
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Make run executable
        if: steps.cache.outputs.cache-hit != 'true'
        run: chmod +x ./run

      - name: Native Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib core

      - name: Check LibCore
        run: |
          if [ ! -f app/libs/libcore.aar ]; then
            echo "ERROR: app/libs/libcore.aar was not generated."
            exit 1
          fi

          ls -lh app/libs/libcore.aar


  build:
    name: Build OSS APK
    runs-on: ubuntu-latest
    needs:
      - libcore

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install Android SDK / NDK
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          SDKM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager

          set +o pipefail
          yes | $SDKM --licenses > /dev/null || true
          set -o pipefail

          $SDKM --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;25.0.8775105"
