name: Preview Build

on:
  workflow_dispatch:

jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Golang Status
        shell: bash
        run: |
          find buildScript libcore -name "*.sh" -type f -print0 \
            | sort -z \
            | xargs -0 cat \
            | sha1sum > golang_status

      - name: Libcore Status
        shell: bash
        run: |
          git ls-files libcore \
            | sort \
            | xargs -r cat \
            | sha1sum > libcore_status

      - name: LibCore Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: app/libs/libcore.aar
          key: libcore-${{ runner.os }}-${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}

      - name: Setup Go
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Make run executable
        if: steps.cache.outputs.cache-hit != 'true'
        run: chmod +x ./run

      - name: Native Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib core

      - name: Check LibCore
        run: |
          if [ ! -f app/libs/libcore.aar ]; then
            echo "ERROR: app/libs/libcore.aar was not generated."
            exit 1
          fi

          ls -lh app/libs/libcore.aar


  build:
    name: Build OSS APK
    runs-on: ubuntu-latest
    needs:
      - libcore

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK / NDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;25.0.8775105"

          yes | sdkmanager --licenses || true

      - name: Golang Status
        shell: bash
        run: |
          find buildScript libcore -name "*.sh" -type f -print0 \
            | sort -z \
            | xargs -0 cat \
            | sha1sum > golang_status

      - name: Libcore Status
        shell: bash
        run: |
          git ls-files libcore \
            | sort \
            | xargs -r cat \
            | sha1sum > libcore_status

      - name: Restore LibCore Cache
        uses: actions/cache@v4
        with:
          path: app/libs/libcore.aar
          key: libcore-${{ runner.os }}-${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}

      - name: Check LibCore
        run: |
          if [ ! -f app/libs/libcore.aar ]; then
            echo "ERROR: app/libs/libcore.aar is missing."
            exit 1
          fi

          ls -lh app/libs/libcore.aar

      - name: Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-oss-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-oss-${{ runner.os }}-

      - name: Prepare Project
        env:
          BUILD_PLUGIN: none
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties

          chmod +x ./run
          chmod +x ./gradlew

          ./run init action gradle

      - name: Build Preview Release
        env:
          BUILD_PLUGIN: none
        run: |
          ./gradlew app:assemblePreviewRelease \
            --no-daemon \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |
          echo "Searching for APK..."

          find app/build/outputs -type f -name "*.apk" -print

          APK=$(find app/build/outputs -type f \
            -name '*arm64-v8a*.apk' \
            | head -n 1)

          if [ -z "$APK" ]; then
            APK=$(find app/build/outputs -type f \
              -name "*.apk" \
              | head -n 1)
          fi

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p release-apk
          cp "$APK" release-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APKs
          path: release-apk/*.apk
          if-no-files-found: error
